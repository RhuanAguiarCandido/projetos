<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Trilha Entrellun — gerador</title>
</head>
<body>
<script>
/*
  Trilha original do filme Entrellun, sintetizada inteiramente por código (Web Audio API).
  120 BPM, Ré maior, 18 s. Sem samples externos: todo ruído vem de um PRNG com semente.
  Marcos (s): 0,95 pausa · 1,5 downbeat/frase 1 · 3,0 motivo · 6,5 motivo (variação) ·
  9,5 entrelaçamento/tensão · 13,25 respiro · 13,5 impacto/logo · 14,0 / 14,5 / 15,0 resolução.
*/
const SR = 48000;
const DUR = 18;
const BEAT = 0.5;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const N = { D1: 26, A1: 33, B1: 35, E1: 28, G1: 31, D2: 38, E2: 40, G2: 43, A2: 45, B2: 47,
  D3: 50, E3: 52, Fs3: 54, G3: 55, A3: 57, B3: 59, Cs4: 61, D4: 62, E4: 64, Fs4: 66, G4: 67, A4: 69, B4: 71,
  D5: 74, E5: 76, Fs5: 78, G5: 79, A5: 81, B5: 83, D6: 86 };

async function renderTrack() {
  const ctx = new OfflineAudioContext(2, SR * DUR, SR);
  const rnd = mulberry32(20261026);

  // ---------- barramentos ----------
  const master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 1.8;
  comp.attack.value = 0.02; comp.release.value = 0.3;
  master.connect(comp).connect(ctx.destination);
  // cauda final: permanece até 16 s e decai até −40 dB no último quadro (sem corte seco)
  master.gain.setValueAtTime(1, 0);
  master.gain.setValueAtTime(1, 16.6);
  master.gain.exponentialRampToValueAtTime(0.012, DUR);

  const music = ctx.createGain(); music.connect(master);
  // respiro de uma colcheia antes do impacto
  music.gain.setValueAtTime(1, 0);
  music.gain.setValueAtTime(1, 13.2);
  music.gain.linearRampToValueAtTime(0.0, 13.25);
  music.gain.setValueAtTime(0.0, 13.495);
  music.gain.linearRampToValueAtTime(1, 13.5);

  // reverb por resposta ao impulso sintetizada (ruído com decaimento exponencial)
  const rev = ctx.createConvolver();
  const irLen = Math.floor(SR * 3.2);
  const ir = ctx.createBuffer(2, irLen, SR);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < irLen; i++) {
      const t = i / SR;
      d[i] = (rnd() * 2 - 1) * Math.exp(-t / 0.75) * (t < 0.012 ? t / 0.012 : 1);
    }
  }
  rev.buffer = ir;
  const revLP = ctx.createBiquadFilter(); revLP.type = 'lowpass'; revLP.frequency.value = 5200;
  const revOut = ctx.createGain(); revOut.gain.value = 0.28;
  rev.connect(revLP).connect(revOut).connect(music);

  // eco estéreo em colcheia pontuada para o motivo
  const dl = ctx.createDelay(1), dr = ctx.createDelay(1);
  dl.delayTime.value = 0.375; dr.delayTime.value = 0.5;
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2600;
  const merger = ctx.createChannelMerger(2);
  const delayIn = ctx.createGain(); delayIn.gain.value = 0.22;
  delayIn.connect(dl); delayIn.connect(dr);
  dl.connect(dlp).connect(fb).connect(dl);
  dl.connect(merger, 0, 0); dr.connect(merger, 0, 1);
  merger.connect(music);

  function noiseBuffer(sec) {
    const b = ctx.createBuffer(1, Math.ceil(sec * SR), SR);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    return b;
  }
  const NOISE = noiseBuffer(DUR);
  function noise(t0, t1) {
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    s.start(t0, (t0 * 7.31) % 4); s.stop(t1);
    return s;
  }
  function out(node, gain, pan = 0, send = 0) {
    const g = ctx.createGain(); g.gain.value = gain;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    node.connect(g).connect(p).connect(music);
    if (send) { const s = ctx.createGain(); s.gain.value = send; p.connect(s).connect(rev); }
    return g;
  }

  // ---------- instrumentos ----------
  function kick(t, v) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(118, t);
    o.frequency.exponentialRampToValueAtTime(47, t + 0.13);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.42);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    o.connect(g).connect(lp); out(lp, 0.9);
    // segundo harmônico curto para o pulso existir também em alto-falante de celular
    const o2 = ctx.createOscillator(); o2.type = 'triangle';
    o2.frequency.setValueAtTime(236, t); o2.frequency.exponentialRampToValueAtTime(110, t + 0.08);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(v * 0.16, t + 0.003);
    g2.gain.exponentialRampToValueAtTime(0.0005, t + 0.12);
    o2.connect(g2); out(g2, 1);
    o.start(t); o.stop(t + 0.45); o2.start(t); o2.stop(t + 0.15);
  }

  function sub(t0, t1, midi, v, att = 0.06, rel = 0.25) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + att);
    g.gain.setValueAtTime(v, Math.max(t0 + att, t1 - rel)); g.gain.linearRampToValueAtTime(0, t1);
    o.connect(g); out(g, 1);
    // harmônico suave (oitava) para presença em telas pequenas
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = hz(midi + 12);
    const g2 = ctx.createGain(); g2.gain.value = 0;
    g2.gain.setValueAtTime(0, t0); g2.gain.linearRampToValueAtTime(v * 0.22, t0 + att);
    g2.gain.setValueAtTime(v * 0.22, Math.max(t0 + att, t1 - rel)); g2.gain.linearRampToValueAtTime(0, t1);
    o2.connect(g2); out(g2, 1);
    o.start(t0); o.stop(t1 + 0.01); o2.start(t0); o2.stop(t1 + 0.01);
  }

  function pad(t0, t1, notes, v, cut0, cut1, att = 0.35, rel = 0.6, send = 0.35) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(cut0, t0); lp.frequency.exponentialRampToValueAtTime(cut1, t1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + att);
    g.gain.setValueAtTime(v, Math.max(t0 + att, t1 - rel)); g.gain.linearRampToValueAtTime(0, t1);
    lp.connect(g);
    out(g, 1, 0, send);
    notes.forEach((m, i) => {
      [-7, 7].forEach((cents, k) => {
        const o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = hz(m); o.detune.value = cents;
        const p = ctx.createStereoPanner(); p.pan.value = (k ? 0.35 : -0.35) * (i % 2 ? -1 : 1);
        const gg = ctx.createGain(); gg.gain.value = 0.11 / notes.length * 2.2;
        o.connect(gg).connect(p).connect(lp);
        o.start(t0); o.stop(t1 + 0.01);
      });
    });
  }

  function pluck(t, midi, v, dec = 0.9, pan = 0) {
    const f = hz(midi);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dec);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(1400, t + dec * 0.6);
    const parts = [[1, 'sine', 1], [2, 'sine', 0.22], [3, 'triangle', 0.06]];
    parts.forEach(([mul, type, amp]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mul;
      const a = ctx.createGain(); a.gain.value = amp;
      o.connect(a).connect(g); o.start(t); o.stop(t + dec + 0.02);
    });
    g.connect(lp);
    const o = out(lp, 1, pan, 0.4);
    const s = ctx.createGain(); s.gain.value = 1; lp.connect(s).connect(delayIn);
  }

  function hat(t, v) {
    const s = noise(t, t + 0.09);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06);
    s.connect(hp).connect(g); out(g, 1, 0.18);
  }

  function whoosh(t0, t1, f0, f1, v, pan = 0) {
    const s = noise(t0, t1);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t1);
    const g = ctx.createGain();
    const mid = t0 + (t1 - t0) * 0.65;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, mid);
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    s.connect(bp).connect(g); out(g, 1, pan, 0.3);
  }

  // ---------- partitura ----------
  // ENCONTRO 0–1,5: as fitas entram (respiração de ruído) e param em 0,95; pausa até 1,5
  kick(0.0, 0.55); kick(0.5, 0.62);
  whoosh(0.0, 0.97, 180, 1100, 0.10, -0.2);
  sub(0.0, 0.97, N.D1, 0.20, 0.3, 0.06);

  // frase 1 no downbeat 1,5
  const pulse = (a, b, vel) => { for (let t = a, i = 0; t < b - 1e-6; t += BEAT, i++) kick(t, vel[i % vel.length]); };
  pulse(1.5, 5.5, [0.5, 0.26, 0.38, 0.26]);
  pulse(5.5, 9.5, [0.62, 0.34, 0.48, 0.34]);
  pluck(1.5, N.D5, 0.2, 1.4);
  sub(1.5, 3.5, N.D2, 0.2); pad(1.5, 3.55, [N.D3, N.A3, N.D4, N.Fs4], 0.12, 380, 700);

  // POTENCIAL — fita varre a tela, motivo de 4 notas
  whoosh(2.55, 3.25, 300, 2600, 0.11, 0.2);
  [[3.0, N.D5], [3.25, N.Fs5], [3.5, N.A5], [4.0, N.G5]].forEach(([t, m], i) => pluck(t, m, 0.2, i === 3 ? 1.5 : 0.8, [-0.15, 0.1, 0.2, 0][i]));
  sub(3.5, 5.5, N.B1, 0.22); pad(3.5, 5.55, [N.B2, N.Fs3, N.B3, N.D4], 0.13, 600, 950);

  // DIREÇÃO — segunda fita entra; hi-hat em colcheias organiza o tempo
  sub(5.5, 7.5, N.G1, 0.25); pad(5.5, 7.55, [N.G2, N.D3, N.G3, N.B3, N.D4], 0.16, 800, 1300);
  whoosh(5.85, 6.45, 1800, 500, 0.09, -0.2);
  for (let t = 6.0; t < 9.5 - 1e-6; t += 0.25) hat(t, (Math.round(t / 0.25) % 2 ? 0.035 : 0.06));
  [[6.5, N.B4], [6.75, N.D5], [7.0, N.Fs5], [7.5, N.E5]].forEach(([t, m], i) => pluck(t, m, 0.19, i === 3 ? 1.4 : 0.8, [0.15, -0.1, -0.2, 0][i]));
  sub(7.5, 9.5, N.E1, 0.27); pad(7.5, 9.55, [N.E2, N.B2, N.E3, N.G3, N.D4], 0.18, 1000, 1600);

  // ENTRELAÇAMENTO — a música cresce
  whoosh(9.25, 9.7, 400, 3000, 0.09, 0.15);
  pulse(9.5, 12.5, [0.85, 0.55, 0.72, 0.55]);
  for (let t = 11.75; t < 12.5 - 1e-6; t += 0.5) kick(t, 0.3);
  for (let t = 9.5; t < 12.5 - 1e-6; t += 0.25) hat(t, (Math.round(t / 0.25) % 2 ? 0.06 : 0.1));
  for (let t = 12.5; t < 13.2 - 1e-6; t += 0.125) hat(t, 0.06 + 0.06 * (t - 12.5) / 0.7);
  // rulo de pulso em semicolcheias até o respiro
  [12.5, 12.625, 12.75, 12.875, 13.0, 13.125].forEach((t, i) => kick(t, 0.35 + i * 0.09));
  [[10.0, N.D5], [10.25, N.Fs5], [10.5, N.A5]].forEach(([t, m], i) => pluck(t, m, 0.19, 0.8, [-0.1, 0.1, 0][i]));
  sub(9.5, 11.5, N.B1, 0.32); pad(9.5, 11.55, [N.B2, N.D3, N.Fs3, N.B3, N.D4], 0.23, 1200, 2200);
  sub(11.5, 12.5, N.G1, 0.33); pad(11.5, 12.55, [N.G2, N.D3, N.G3, N.B3, N.D4], 0.24, 2000, 2800, 0.05, 0.08);
  sub(12.5, 13.25, N.A1, 0.34, 0.03, 0.05); pad(12.5, 13.25, [N.A2, N.E3, N.A3, N.Cs4, N.E4], 0.25, 2600, 4200, 0.04, 0.05);
  // textura de tensão: ruído filtrado com corte subindo
  {
    const s = noise(9.5, 13.26);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(300, 9.5); bp.frequency.exponentialRampToValueAtTime(6000, 13.2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, 9.5); g.gain.exponentialRampToValueAtTime(0.05, 11.5);
    g.gain.exponentialRampToValueAtTime(0.15, 13.2); g.gain.linearRampToValueAtTime(0, 13.25);
    s.connect(bp).connect(g); out(g, 1, 0, 0.2);
  }

  // REVELAÇÃO — impacto preciso em 13,5
  const T = 13.5;
  {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(96, T); o.frequency.exponentialRampToValueAtTime(37, T + 0.7);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(0.5, T + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, T + 2.0);
    o.connect(g); out(g, 1); o.start(T); o.stop(T + 2.05);
    // corpo
    const b = noise(T, T + 0.4);
    const blp = ctx.createBiquadFilter(); blp.type = 'lowpass'; blp.frequency.value = 420;
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, T); bg.gain.exponentialRampToValueAtTime(0.42, T + 0.004);
    bg.gain.exponentialRampToValueAtTime(0.001, T + 0.3);
    b.connect(blp).connect(bg); out(bg, 1, 0, 0.5);
    // ataque curto e brilhante
    const h = noise(T, T + 0.12);
    const hhp = ctx.createBiquadFilter(); hhp.type = 'highpass'; hhp.frequency.value = 3200;
    const hg = ctx.createGain();
    hg.gain.setValueAtTime(0.0001, T); hg.gain.exponentialRampToValueAtTime(0.16, T + 0.002);
    hg.gain.exponentialRampToValueAtTime(0.0005, T + 0.09);
    h.connect(hhp).connect(hg); out(hg, 1, 0, 0.6);
  }
  kick(T, 0.5);
  sub(T, DUR + 0.3, N.D1, 0.34, 0.01, 1.5);
  pad(T, DUR + 0.3, [N.D2, N.A2, N.D3, N.Fs3, N.A3, N.D4, N.Fs4], 0.3, 3600, 1100, 0.02, 1.0, 0.5);
  pluck(T, N.D5, 0.2, 2.0);
  // motivo resolvido acompanhando Entrellun (14,0), Gente e Gestão (14,5) e a frase‑assinatura (15,0)
  pluck(14.0, N.Fs5, 0.17, 1.4, -0.12);
  pluck(14.5, N.A5, 0.17, 1.4, 0.12);
  pluck(15.0, N.D6, 0.16, 2.6, 0); pluck(15.0, N.A4, 0.1, 2.6, 0);

  const buf = await ctx.startRendering();
  return [buf.getChannelData(0), buf.getChannelData(1)];
}

window.renderTrackPCM = async (gainDb) => {
  const [l, r] = await renderTrack();
  let peak = 0;
  for (let i = 0; i < l.length; i++) peak = Math.max(peak, Math.abs(l[i]), Math.abs(r[i]));
  const g = Math.pow(10, gainDb / 20);
  const n = l.length;
  const pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) {
    pcm[2 * i] = Math.max(-32768, Math.min(32767, Math.round(l[i] * g * 32767)));
    pcm[2 * i + 1] = Math.max(-32768, Math.min(32767, Math.round(r[i] * g * 32767)));
  }
  const bytes = new Uint8Array(pcm.buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { peak, frames: n, b64: btoa(s) };
};
</script>
</body>
