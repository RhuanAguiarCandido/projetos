<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(../assets/Montserrat-500.ttf);font-weight:500}
@font-face{font-family:M;src:url(../assets/Montserrat-600.ttf);font-weight:600}
@font-face{font-family:M;src:url(../assets/Montserrat-700.ttf);font-weight:700}
@font-face{font-family:M;src:url(../assets/Montserrat-800.ttf);font-weight:800}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const C={deep:'#061A4F',elec:'#1557FF',cyan:'#37D5F2',coral:'#FF7855',white:'#F4F7FC'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off1=document.createElement('canvas');off1.width=W;off1.height=H;const o1=off1.getContext('2d');

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;          // easeInOutCubic
const eo=x=>1-Math.pow(1-x,3);                               // easeOutCubic
const eo5=x=>1-Math.pow(1-x,5);
const sstep=x=>x*x*(3-2*x);

function catmull(pts,n=8,closed=false){
  const out=[];const P=closed?[pts[pts.length-1],...pts,pts[0],pts[1]]:[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){
    const [p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}
  }
  out.push(P[P.length-2]);return out;
}
function withLen(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {pts,L,total:L[L.length-1]};}
function pointAt(P,s){const {pts,L}=P;if(s<=0)return pts[0];if(s>=P.total)return pts[pts.length-1];
  let lo=0,hi=L.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<s)lo=m;else hi=m;}
  const f=(s-L[lo])/(L[hi]-L[lo]);return [lerp(pts[lo][0],pts[hi][0],f),lerp(pts[lo][1],pts[hi][1],f)];}
// stroke the arc-length interval [s0,s1] of a path
function strokeSub(c,P,s0,s1,width,color,cap='round'){
  if(s1-s0<0.5)return;const {pts,L}=P;c.beginPath();const a=pointAt(P,s0);c.moveTo(a[0],a[1]);
  for(let i=0;i<pts.length;i++){if(L[i]>s0&&L[i]<s1)c.lineTo(pts[i][0],pts[i][1]);}
  const b=pointAt(P,s1);c.lineTo(b[0],b[1]);c.lineWidth=width;c.strokeStyle=color;c.lineCap=cap;c.lineJoin='round';c.stroke();}

// rich text: segs=[[text,color],...]
function richWidth(segs,font){ctx.font=font;return segs.reduce((w,s)=>w+ctx.measureText(s[0]).width,0);}
function drawRich(segs,x,y,font,align,alpha){
  ctx.font=font;const w=richWidth(segs,font);let cx=align==='center'?x-w/2:x;
  ctx.globalAlpha=alpha;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  for(const [t,col] of segs){ctx.fillStyle=col;ctx.fillText(t,cx,y);cx+=ctx.measureText(t).width;}
  ctx.globalAlpha=1;
}
// block reveal: rises from below inside a clip band, fades; exit fades + drifts up
function textBlock(t,tin,tout,lines,opt){
  const pin=eo5(prog(t,tin,tin+0.75)), pout=eio(prog(t,tout,tout+0.4));
  if(pin<=0||pout>=1)return;
  const {x,y,size,lh,align='left',weight=700}=opt;const font=`${weight} ${size}px M`;
  lines.forEach((segs,i)=>{
    const by=y+i*lh;const li=eo5(prog(t,tin+i*0.08,tin+i*0.08+0.75));
    ctx.save();ctx.beginPath();ctx.rect(0,by-size*1.05-pout*40,W,size*1.45);ctx.clip();
    const dy=(1-li)*size*0.9 - pout*26;
    drawRich(segs,x,by+dy,font,align,Math.min(1,li*1.4)*(1-pout));
    ctx.restore();
  });
}

// ---------- scene paths ----------
// Scene 1 traces (deep background), approaching each other
const trA=withLen(catmull([[-80,300],[160,330],[380,420],[560,560],[700,640]],16));
const trB=withLen(catmull([[1160,1640],[930,1610],[720,1520],[540,1380],[400,1300]],16));

// curved wipe boundary: region above (dir=-1) or below the curve gets painted
function wipeCurve(yBase,phase){const pts=[];for(let x=-60;x<=W+60;x+=20){pts.push([x,yBase+90*Math.sin(x/W*Math.PI*1.6+phase)-(x-540)*0.32]);}return pts;}
function drawWipe(t,t0,t1,colorNew,ribbonCol,fromBottom){
  const p=eio(prog(t,t0,t1));if(p<=0)return false;
  const y=fromBottom?lerp(H+520,-520,p):lerp(-520,H+520,p);
  const pts=wipeCurve(y,fromBottom?0.4:2.2);
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const q of pts)ctx.lineTo(q[0],q[1]);
  if(fromBottom){ctx.lineTo(W+60,H+600);ctx.lineTo(-60,H+600);}else{ctx.lineTo(W+60,-600);ctx.lineTo(-60,-600);}
  ctx.closePath();ctx.fillStyle=colorNew;ctx.fill();
  // ribbon riding the edge (solid, no glow)
  const P=withLen(pts);strokeSub(ctx,P,0,P.total,34,ribbonCol,'butt');
  const P2=withLen(pts.map(q=>[q[0],q[1]+(fromBottom?44:-44)]));strokeSub(ctx,P2,0,P2.total,10,C.cyan,'butt');
  return p>=1;
}

// braid around a spine: two ribbons that interlace (over / under alternates at each crossing)
function braid(t,opts){
  const {spine,amp,lambda,phase,w,colA,colB,bg,reveal,alpha}=opts;
  const S=spine;const total=S.total*reveal;if(total<2)return;
  const step=6;const N=Math.floor(total/step);
  const ra=[],rb=[],ss=[];
  for(let i=0;i<=N;i++){const s=i*step;const p=pointAt(S,s),q=pointAt(S,Math.min(S.total,s+2));
    let tx=q[0]-p[0],ty=q[1]-p[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;const nx=-ty,ny=tx;
    const o=amp(s)*Math.sin(2*Math.PI*s/lambda+phase);
    ra.push([p[0]+nx*o,p[1]+ny*o]);rb.push([p[0]-nx*o,p[1]-ny*o]);ss.push(s);}
  ctx.globalAlpha=alpha;ctx.lineJoin='round';
  const line=(arr,i0,i1,wd,col,cap)=>{i0=Math.max(0,i0);i1=Math.min(N,i1);if(i1-i0<1)return;ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(arr[i0][0],arr[i0][1]);for(let i=i0+1;i<=i1;i++)ctx.lineTo(arr[i][0],arr[i][1]);ctx.lineWidth=wd;ctx.strokeStyle=col;ctx.stroke();};
  // both ribbons whole, then the over-ribbon is redrawn around every crossing (alternating)
  line(rb,0,N,w,colB,'round');line(ra,0,N,w,colA,'round');
  const half=Math.round(lambda/7/step);
  for(let k=Math.ceil(phase/Math.PI)-1;;k++){
    const sc=(k*Math.PI-phase)*lambda/(2*Math.PI);if(sc>total+lambda)break;if(sc<-lambda)continue;
    const ic=Math.round(sc/step);const [arr,col]=(k%2===0)?[ra,colA]:[rb,colB];
    line(arr,ic-half,ic+half,w+14,bg,'butt');line(arr,ic-half-2,ic+half+2,w,col,'butt');
  }
  ctx.globalAlpha=1;
}
const spine3=withLen(catmull([[-120,1720],[200,1640],[520,1500],[820,1360],[1200,1180]],16));

// ---------- logo assets ----------
const IM={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IM[n]=i;r();};i.src=src;});}
let H1,H2;
const LOGO_BOX={x0:106,x1:1172,y0:353,y1:996};    // logo bounds in source pixels
const SYM_C=[(243+1005)/2,(353+662)/2];           // symbol centre in source pixels

// symbol pose: scale s, centre (cx,cy) in screen space -> maps source px
function symXf(s,cx,cy){return p=>[cx+(p[0]-SYM_C[0])*s, cy+(p[1]-SYM_C[1])*s];}
function drawFaceMasked(img,path,pr,xf,s){
  o1.setTransform(1,0,0,1,0,0);o1.globalCompositeOperation='source-over';o1.clearRect(0,0,W,H);
  if(pr<=0)return;
  if(pr<1){
    const P=withLen(path.pts.map(xf));
    strokeSub(o1,P,0,P.total*pr,120*s,'#fff','round');
    o1.globalCompositeOperation='source-in';
  }
  o1.setTransform(s,0,0,s,xf([0,0])[0],xf([0,0])[1]);
  o1.drawImage(img,0,0);
  o1.setTransform(1,0,0,1,0,0);o1.globalCompositeOperation='source-over';
  ctx.drawImage(off1,0,0);
}
function extend(pts,d){const a=pts[0],b=pts[1],y=pts[pts.length-1],z=pts[pts.length-2];
  const u=(p,q)=>{const l=Math.hypot(p[0]-q[0],p[1]-q[1]);return [(p[0]-q[0])/l*d,(p[1]-q[1])/l*d];};
  const s=u(a,b),e=u(y,z);return [[a[0]+s[0],a[1]+s[1]],...pts,[y[0]+e[0],y[1]+e[1]]];}

// ---------- frame ----------
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  // ===== background states =====
  // 0-4: deep | 4-17: white (wipe up at 3.85) | 17-25: deep (wipe down at 16.7)
  const toWhite=prog(t,3.85,4.65), toDeep=prog(t,16.5,17.3);
  if(t<16.5){ctx.fillStyle=t<4.65?C.deep:C.white;ctx.fillRect(0,0,W,H);} else {ctx.fillStyle=t<17.3?C.white:C.deep;ctx.fillRect(0,0,W,H);}

  // ===== SCENE 1 : encontros =====
  if(t<4.65){
    const pa=eio(prog(t,0.1,3.4)), pb=eio(prog(t,0.35,3.6));
    const tailA=trA.total*0.0, tailB=0;
    strokeSub(ctx,trA,tailA,trA.total*pa,10,C.elec);
    strokeSub(ctx,trB,tailB,trB.total*pb,10,C.cyan);
    // leading dots
    if(pa>0){const p=pointAt(trA,trA.total*pa);ctx.fillStyle=C.elec;ctx.beginPath();ctx.arc(p[0],p[1],11,0,7);ctx.fill();}
    if(pb>0){const p=pointAt(trB,trB.total*pb);ctx.fillStyle=C.cyan;ctx.beginPath();ctx.arc(p[0],p[1],11,0,7);ctx.fill();}
    const o={x:540,y:880,size:92,lh:112,align:'center',weight:700};
    textBlock(t,0.45,3.6,[[['Toda empresa',C.white]],[['é feita',C.white]]],o);
    textBlock(t,1.35,3.6,[[['de encontros.',C.white]]],{...o,y:880+2*112});
  }
  if(t>=3.85&&t<4.7) drawWipe(t,3.85,4.65,C.white,C.elec,true);

  // ===== SCENE 2 : potencial (white) =====
  if(t>=4.0&&t<12.2){
    // discreet ongoing paths
    const a2=0.22*sstep(prog(t,4.4,5.2))*(1-sstep(prog(t,7.9,8.6)));
    if(a2>0){ctx.globalAlpha=a2;
      const PA=withLen(catmull([[-80,330],[260,290],[620,360],[1160,250]],16));
      const PB=withLen(catmull([[-80,1660],[380,1560],[760,1600],[1160,1500]],16));
      const d=(t-4.4)*90;strokeSub(ctx,PA,0,Math.min(PA.total,300+d*3),8,C.elec);strokeSub(ctx,PB,0,Math.min(PB.total,300+d*3),8,C.elec);
      ctx.globalAlpha=1;}
  }
  if(t>=4.3&&t<8.2){
    // small coral detail
    const pd=eo(prog(t,4.5,5.1))*(1-eio(prog(t,7.55,7.95)));
    ctx.fillStyle=C.coral;ctx.fillRect(120,640,90*pd,8);
    const o={x:120,y:800,size:88,lh:106,align:'left'};
    textBlock(t,4.45,7.55,[[['Entre o potencial',C.deep]],[['das ',C.deep],['pessoas',C.elec]]],o);
    textBlock(t,5.85,7.55,[[['e o futuro',C.deep]],[['do ',C.deep],['negócio',C.elec],['.',C.deep]]],{...o,y:800+2*106+40});
  }

  // ===== SCENE 3 : conexão (white) =====
  if(t>=7.9&&t<17.5){
    const ain=sstep(prog(t,7.9,8.8));
    const conv=eio(prog(t,8.0,10.4));              // separate -> connected
    const rev=eio(prog(t,7.9,9.6));
    const settle=eio(prog(t,11.8,12.8));           // calmer rhythm for scene 4
    braid(t,{spine:spine3,amp:s=>lerp(lerp(190,46,conv),34,settle)*(0.35+0.65*sstep(clamp(s/500))),lambda:lerp(lerp(560,360,conv),300,settle),
      phase:-(t-7.9)*2.1,w:20,colA:C.elec,colB:C.deep,bg:C.white,reveal:rev,alpha:ain});
  }
  if(t>=8.2&&t<12.2){
    const o={x:120,y:640,size:84,lh:102,align:'left'};
    textBlock(t,8.35,11.7,[[['Quando essas',C.deep]],[['forças se',C.deep]],[['conectam,',C.deep]]],o);
    textBlock(t,10.0,11.7,[[['o crescimento',C.elec]],[['ganha direção.',C.elec]]],{...o,y:640+3*102+50});
  }

  // ===== SCENE 4 : atuação (white) =====
  if(t>=11.9&&t<17.0){
    const X=170,Y0=610,GAP=252,size=70,lh=82;
    const starts=[12.05,13.65,15.15];const tout=16.3;
    const pout=eio(prog(t,tout,tout+0.4));
    // connector line on the left margin column (x=128) linking the markers
    const lineP=eo(prog(t,12.0,15.6));
    ctx.globalAlpha=1-pout;ctx.strokeStyle=C.deep;ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(128,Y0-50);ctx.lineTo(128,Y0-50+(2*GAP)*lineP);ctx.stroke();
    starts.forEach((s,i)=>{const pm=eo(prog(t,s,s+0.4));if(pm>0){ctx.fillStyle=C.coral;ctx.beginPath();ctx.arc(128,Y0-50+i*GAP,9*pm,0,7);ctx.fill();}});
    ctx.globalAlpha=1;
    const L=[[['Desenvolvemos',C.deep]],[['lideranças.',C.elec]],[['Organizamos',C.deep]],[['processos.',C.elec]],[['Conectamos pessoas',C.deep]],[['e resultados.',C.elec]]];
    for(let i=0;i<3;i++){
      textBlock(t,starts[i],tout,[L[2*i],L[2*i+1]],{x:X,y:Y0+i*GAP,size,lh,align:'left',weight:700});
    }
  }
  if(t>=16.5&&t<17.35) drawWipe(t,16.5,17.3,C.deep,C.elec,false);

  // ===== SCENE 5 : nascimento =====
  const s5=1.1, c5=[540,860];
  const sF=860/(LOGO_BOX.x1-LOGO_BOX.x0);
  const logoTop=500;
  const cF=[540+(SYM_C[0]-(LOGO_BOX.x0+LOGO_BOX.x1)/2)*sF, logoTop+(SYM_C[1]-LOGO_BOX.y0)*sF];
  if(t>=17.2){
    const mv=eio(prog(t,20.15,21.0));
    const s=lerp(s5,sF,mv), cx=lerp(c5[0],cF[0],mv), cy=lerp(c5[1],cF[1],mv);
    const xf=symXf(s,cx,cy);
    const p1=eio(prog(t,17.3,18.55)), p2=eio(prog(t,18.35,19.55));
    if(p2<1){
      drawFaceMasked(IM.dark,H2,p2,xf,s);   // under face first
      drawFaceMasked(IM.light,H1,p1,xf,s);  // over face passes on top at the crossing
    }
    // resolve: exact official symbol / then exact full logo
    const full=prog(t,19.4,19.6);
    if(p2>=1){
      const wm=eo(prog(t,20.65,21.25));
      if(t<21.3){
        ctx.setTransform(s,0,0,s,xf([0,0])[0],xf([0,0])[1]);ctx.drawImage(IM.sym,0,0);
        // wordmark part of the official logo fades in, already at final pose
        if(wm>0){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=wm;
          const ox=540-((LOGO_BOX.x0+LOGO_BOX.x1)/2)*sF, oy=logoTop-LOGO_BOX.y0*sF+(1-wm)*24;
          ctx.save();ctx.beginPath();ctx.rect(0,oy+676*sF,W,H);ctx.clip();
          ctx.setTransform(sF,0,0,sF,ox,oy);ctx.drawImage(IM.logo,0,0);ctx.restore();ctx.globalAlpha=1;}
      } else {
        // final: the complete official logo image, unaltered
        const ox=540-((LOGO_BOX.x0+LOGO_BOX.x1)/2)*sF, oy=logoTop-LOGO_BOX.y0*sF;
        ctx.setTransform(sF,0,0,sF,ox,oy);ctx.drawImage(IM.logo,0,0);
      }
      ctx.setTransform(1,0,0,1,0,0);
    }
    textBlock(t,17.6,19.75,[[['Assim nasce a ',C.white],['Entrellun',C.white],['.',C.white]]],{x:540,y:1210,size:62,lh:70,align:'center',weight:600});
  }

  // ===== SCENE 6 : assinatura =====
  if(t>=21.0){
    const y0=500+(LOGO_BOX.y1-LOGO_BOX.y0)*sF;     // logo bottom
    const pd=eo(prog(t,21.2,21.7));
    ctx.fillStyle=C.coral;ctx.fillRect(540-45*pd,y0+140,90*pd,7);
    const o={x:540,y:y0+250,size:60,lh:76,align:'center',weight:600};
    textBlock(t,21.35,99,[[['Conexões que sustentam',C.white]]],o);
    textBlock(t,21.55,99,[[['o crescimento.',C.white]]],{...o,y:y0+250+76});
  }
}

window.ready=(async()=>{
  await Promise.all([load('logo','../assets/logo_dark.png'),load('sym','../assets/sym_full.png'),
    load('light','../assets/sym_light_face.png'),load('dark','../assets/sym_dark_face.png')]);
  const sp=await (await fetch('../assets/sympath.json')).json();
  H1=withLen(catmull(extend(sp.h1,40),6));H2=withLen(catmull(extend(sp.h2,40),6));
  for(const w of [500,600,700,800])await document.fonts.load(`${w} 40px M`);
  window.render=render;return true;
})();
</script></body></html>
